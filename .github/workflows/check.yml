name: Source checks
on: [push, pull_request]
jobs:
  shared-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
      - run: npm run build
      - run: node tests/atlas_labels.mjs
      - run: node tests/atlas_resize.mjs
      - run: node tests/vault_entries.mjs
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer libreoffice-math
      - run: python -m pytest tests/test_xai.py tests/test_admin_egress.py tests/test_companion.py tests/test_companion_tools.py tests/test_companion_controls.py tests/test_companion143.py tests/test_workspace143.py tests/test_companion_stickers.py tests/test_vault145.py tests/test_word146.py tests/test_memory146.py -q
      - run: python scripts/source_smoke.py
