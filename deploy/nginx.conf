# Web entry: 7780. API service: 7779. Existing services are untouched.
server {
    listen 7780;
    server_name _;
    root /opt/dawnbreaker/current/dist;
    index index.html;
    client_max_body_size 32m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    gzip on;
    gzip_types application/json text/css application/javascript;
    location /api/ {
        proxy_pass http://127.0.0.1:7779;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
